<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<header th:replace="~{fragments :: nav('')}"></header>

<main>
    <h1>No se pudo completar la operación</h1>

    <p class="intro">Revise que los cuatro servicios estén en ejecución.</p>

</body>
</html>
