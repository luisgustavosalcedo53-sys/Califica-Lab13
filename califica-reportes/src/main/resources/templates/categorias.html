<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Categorías')}"></head>
<body>
<header th:replace="~{fragments :: nav('categorias')}"></header>

<main>
    <h1>Reporte por categoría</h1>
    <p class="intro">Streams y calificaciones agrupados por categoría, del mejor al peor promedio.</p>

    <table class="tabla" th:unless="${categorias.isEmpty()}">
        <thead>
        <tr><th>Categoría</th><th>Streams</th><th>Calificaciones</th><th>Promedio</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.categoria()}">Programación</td>
            <td th:text="${c.streams()}">2</td>
            <td th:text="${c.calificaciones()}">3</td>
            <td>
                <span class="estrellas" aria-hidden="true"
                      th:text="${#strings.repeat('★', c.estrellas()) + #strings.repeat('☆', 5 - c.estrellas())}">★★★★☆</span>
                <span class="tenue"
                      th:text="${c.calificaciones() == 0 ? 'Sin calificar' : #numbers.formatDecimal(c.promedio(), 1, 1)}">4,5</span>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="vacio" th:if="${categorias.isEmpty()}">Todavía no hay streams registrados.</p>
</main>
</body>
</html>
