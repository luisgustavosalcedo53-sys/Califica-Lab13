<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${perfil.usuario().nombre()})}"></head>
<body>
<header th:replace="~{fragments :: nav('usuarios')}"></header>

<main>
    <a th:href="@{/reportes/usuarios}" class="volver">Volver a usuarios</a>
    <h1 th:text="${perfil.usuario().nombre()}">Ana Torres</h1>
    <p class="intro" th:text="${perfil.usuario().email()}">ana@tecsup.edu.pe</p>

    <div class="promedio" th:unless="${perfil.items().isEmpty()}">
        <span class="promedio-numero" th:text="${#numbers.formatDecimal(perfil.promedio(), 1, 1)}">4,0</span>
        <span class="tenue" th:text="${perfil.items().size() == 1 ? 'promedio de 1 calificación'
                                       : 'promedio de ' + perfil.items().size() + ' calificaciones'}">promedio de 2 calificaciones</span>
    </div>

    <table class="tabla" th:unless="${perfil.items().isEmpty()}">
        <thead>
        <tr><th>Stream</th><th>Puntuación</th><th>Comentario</th><th>Fecha</th></tr>
        </thead>
        <tbody>
        <tr th:each="i : ${perfil.items()}">
            <td>
                <span th:text="${i.titulo()}">Spring Boot desde cero</span>
                <div class="tenue" th:text="${i.categoria()}">Programación</div>
            </td>
            <td class="estrellas"
                th:text="${#strings.repeat('★', i.puntuacion()) + #strings.repeat('☆', 5 - i.puntuacion())}">★★★★★</td>
            <td th:text="${#strings.isEmpty(i.comentario()) ? '–' : i.comentario()}">Muy claro</td>
            <td class="tenue" th:text="${i.fecha() == null ? '' : #temporals.format(i.fecha(), 'dd/MM/yyyy')}">01/11/2026</td>
        </tr>
        </tbody>
    </table>
    <p class="vacio" th:if="${perfil.items().isEmpty()}">Este usuario todavía no ha calificado ningún stream.</p>
</main>
</body>
</html>
