<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<header th:replace="~{fragments :: nav('')}"></header>

<main>
    <h1>No se pudo generar el reporte</h1>
    <p class="aviso aviso-error" role="alert"
       th:text="${mensaje != null ? mensaje : 'Ocurrió un error inesperado'}">El servicio de streams no está disponible</p>
    <a th:href="@{/reportes}" class="volver">Volver a los reportes</a>
</main>
</body>
</html>
