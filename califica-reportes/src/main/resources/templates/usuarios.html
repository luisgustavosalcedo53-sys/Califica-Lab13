<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Usuarios')}"></head>
<body>
<header th:replace="~{fragments :: nav('usuarios')}"></header>

<main>
    <h1>Actividad de los usuarios</h1>
    <p class="intro">Cuántas calificaciones dio cada usuario y qué puntuación pone en promedio.</p>

    <table class="tabla" th:unless="${usuarios.isEmpty()}">
        <thead>
        <tr><th>Usuario</th><th>Calificaciones</th><th>Promedio que otorga</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td>
                <a th:href="@{/reportes/usuarios/{id}(id=${u.id()})}" th:text="${u.nombre()}">Ana Torres</a>
                <div class="tenue" th:text="${u.email()}">ana@tecsup.edu.pe</div>
            </td>
            <td th:text="${u.calificaciones()}">2</td>
            <td th:text="${u.calificaciones() == 0 ? '–' : #numbers.formatDecimal(u.promedio(), 1, 1)}">4,0</td>
        </tr>
        </tbody>
    </table>
    <p class="vacio" th:if="${usuarios.isEmpty()}">Todavía no hay usuarios registrados.</p>
</main>
</body>
</html>
