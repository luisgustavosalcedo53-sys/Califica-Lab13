server.port=8083
spring.application.name=calificaciones-service
spring.datasource.url=jdbc:h2:mem:calificacionesdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
servicios.usuarios.url=${SERVICIOS_USUARIOS_URL:http://localhost:8081}
servicios.streams.url=${SERVICIOS_STREAMS_URL:http://localhost:8082}

# Configuración de la referencia del docente
spring.jpa.open-in-view=false
spring.sql.init.encoding=UTF-8
spring.h2.console.path=/h2-console
